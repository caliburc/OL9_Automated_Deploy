---
vsphere_server: "apvcsa1p.example.mil"
vsphere_user: "administrator@vsphere.local"

## HEDCADM SSH PubKey ###
## USED IN USERDATA TERRAFORM DATA ###
hedcadm_ssh_public_key: "ssh-rsa mykeydata"

## IPA VARIABLE BLOCK ###
## USED IN BASELINE MAIN TASKS ###
ipa_servers:
  - apipa6p.example.mil
  - apipa7p.example.mil
  - apipa8p.example.mil
ipa_domain: example.mil
ipa_realm: IDM.HEDC.MIL
ipa_client_state_file: /etc/ipa/default.conf

#Do not change these values unless approved
#These are the baseline roles for the vm_type defined in the build template
#If additional roles are needed per server, add them to the server_roles list in the build template for that VM
vm_type_role_map:
  app:
    - baseline
    - ol9STIG
  app_r9:
    - baseline
    - rhel9STIG
  weblogic:
    - baseline
    - ol9STIG
    - weblogic14c
  weblogic_r9:
    - baseline
    - rhel9STIG
    - weblogic14c
  oracle_db:
    - baseline
    - ol9STIG
    - oracle19c
  oracle_db_r9:
    - baseline
    - rhel9STIG
    - oracle19c
  generic_db:
    - baseline
    - ol9STIG
    - generic_db
  generic_db_r9:
    - baseline
    - rhel9STIG
    - generic_db


#Do not change these values unless approved
#These are our baseline VM build sizes
#If additional CPU, Mememory, Disks, or Disk Size changes are needed, add them to the build template for that VM
vm_type_profiles:
  generic:
    num_cpus: 4
    memory_gb: 8
    firmware: "efi"
    disk0_size_gb: 70
    additional_disks: []
  app:
    num_cpus: 4
    memory_gb: 8
    firmware: "efi"
    disk0_size_gb: 70
    additional_disks: 
      - label: app
        size_gb: 60
        unit_number: 1
        thin_provisioned: false
        eagerly_scrub: false
  app_r9:
    num_cpus: 4
    memory_gb: 8
    firmware: "efi"
    disk0_size_gb: 70
    additional_disks: 
      - label: app
        size_gb: 60
        unit_number: 1
        thin_provisioned: false
        eagerly_scrub: false
  weblogic:
    num_cpus: 4
    memory_gb: 8
    firmware: "efi"
    disk0_size_gb: 70
    additional_disks: 
      - label: app
        size_gb: 60
        unit_number: 1
        thin_provisioned: false
        eagerly_scrub: false
  weblogic_r9:
    num_cpus: 4
    memory_gb: 8
    firmware: "efi"
    disk0_size_gb: 70
    additional_disks: 
      - label: app
        size_gb: 60
        unit_number: 1
        thin_provisioned: false
        eagerly_scrub: false
  oracle_db:
    num_cpus: 8
    memory_gb: 32
    firmware: "efi"
    disk0_size_gb: 70
    additional_disks:
      - label: app
        size_gb: 60
        unit_number: 1
        thin_provisioned: false
        eagerly_scrub: false
      - label: data
        size_gb: 350
        unit_number: 2
        thin_provisioned: false
        eagerly_scrub: false
  oracle_db_r9:
    num_cpus: 8
    memory_gb: 32
    firmware: "efi"
    disk0_size_gb: 70
    additional_disks:
      - label: app
        size_gb: 60
        unit_number: 1
        thin_provisioned: false
        eagerly_scrub: false
      - label: data
        size_gb: 350
        unit_number: 2
        thin_provisioned: false
        eagerly_scrub: false
  generic_db:
    num_cpus: 8
    memory_gb: 32
    firmware: "efi"
    disk0_size_gb: 70
    additional_disks:
      - label: app
        size_gb: 60
        unit_number: 1
        thin_provisioned: false
        eagerly_scrub: false
      - label: data
        size_gb: 350
        unit_number: 2
        thin_provisioned: false
        eagerly_scrub: false  
    generic_db_r9:
      num_cpus: 8
      memory_gb: 32
      firmware: "efi"
      disk0_size_gb: 70
      additional_disks:
        - label: app
          size_gb: 60
          unit_number: 1
          thin_provisioned: false
          eagerly_scrub: false
        - label: data
          size_gb: 350
          unit_number: 2
          thin_provisioned: false
          eagerly_scrub: false  



