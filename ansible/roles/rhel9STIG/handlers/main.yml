- name: dconf_update
  command: dconf update
- name: auditd_restart
  command: /usr/sbin/service auditd restart
- name: augenrules_load
  # augenrules concatenates every *.rules file under /etc/audit/rules.d/ ALPHABETICALLY
  # before loading it - our managed file is named "audit.rules", which sorts after
  # access.rules/actions.rules, so a "-D" embedded inside our own file can't protect
  # THEIR rules from a "Rule exists" conflict if they're already resident in the
  # kernel from a prior load (they get re-added before our file's turn even comes up
  # in that same pass). Clear the kernel's rule table directly here instead, before
  # augenrules touches anything, so reload order never matters.
  #
  # If a prior run already reached RHEL-09-654275's "-e 2" (make the audit
  # configuration immutable), the kernel refuses ANY further rule change -
  # including -D - until reboot. That is the STIG's own intended behavior, not a
  # bug, so don't hard-fail the whole play on it: detect it and skip the reload.
  ansible.builtin.shell: |
    if auditctl -s | grep -q '^enabled 2$'; then
      echo "SKIPPED: audit rules are immutable (enabled=2) from a prior load - reboot required before any changes can be applied."
      exit 0
    fi
    auditctl -D && augenrules --load
  register: rhel9stig_augenrules_load_result
  changed_when: "'SKIPPED' not in rhel9stig_augenrules_load_result.stdout"
- name: pcscd_restart
  service:
    name: pcscd
    state: restarted
- name: ssh_restart
  service:
    name: sshd
    state: restarted
- name: rsyslog_restart
  service:
    name: rsyslog
    state: restarted
- name: sysctl_load_settings
  command: sysctl --system
- name: daemon_reload
  systemd:
    daemon_reload: true
- name: networkmanager_reload
  service:
    name: NetworkManager
    state: reloaded
- name: logind_restart
  service:
    name: systemd-logind
    state: restarted
- name: with_faillock_enable
  command: authselect enable-feature with-faillock
- name: do_reboot
  debug:
    msg: >-
      One or more STIG settings applied on this run require a reboot to take full effect.
      No automatic reboot was performed - schedule one for this host.
