- name: dconf_update
  command: dconf update
- name: auditd_restart
  command: /usr/sbin/service auditd restart
- name: augenrules_load
  command: augenrules --load
- name: pcscd_restart
  service:
    name: pcscd
    state: restarted
- name: ssh_restart
  service:
    name: sshd
    state: restarted
- name: rsyslog_restart
  service:
    name: rsyslog
    state: restarted
- name: sysctl_load_settings
  command: sysctl --system
- name: daemon_reload
  systemd:
    daemon_reload: true
- name: networkmanager_reload
  service:
    name: NetworkManager
    state: reloaded
- name: logind_restart
  service:
    name: systemd-logind
    state: restarted
- name: with_faillock_enable
  command: authselect enable-feature with-faillock
- name: do_reboot
  debug:
    msg: >-
      One or more STIG settings applied on this run require a reboot to take full effect.
      No automatic reboot was performed - schedule one for this host.
