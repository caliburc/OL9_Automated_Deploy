- name: Join the host to IPA/IdM non-interactively
  ansible.builtin.command:
    cmd: >
      ipa-client-install
      --unattended
      --mkhomedir
      --enable-dns-updates
      --hostname={{ ansible_facts['nodename'] }}
      --domain={{ ipa_domain }}
      --realm={{ ipa_realm }}
      {% for server in ipa_servers %}--server={{ server }} {% endfor %}
      {% for server in ipa_servers %}--ntp-server={{ server }} {% endfor %}
      --automount-location={{ build_vm.ipa_automount_location | default('hedc') }}
      --principal={{ ipa_principal_user }}
      --password={{ ipa_principal_pass }}
    creates: "{{ ipa_client_state_file }}"
  no_log: true
  register: ipa_join_result
  tags: ipa

- name: Verify IdM client config file exists
  ansible.builtin.stat:
    path: "{{ ipa_client_state_file }}"
  register: ipa_default_conf
  tags: ipa

- name: Fail if join did not complete
  ansible.builtin.fail:
    msg: "IPA client enrollment did not complete successfully"
  when: not ipa_default_conf.stat.exists
  tags: ipa

- name: Configure Server in IPA (Hostgroups and Description)
  block:
    - name: Obtain Kerberos ticket
      ansible.builtin.shell: "echo '{{ ipa_principal_pass }}' | kinit {{ ipa_principal_user }}"
      no_log: true

    - name: Determine environment description from build.yml IP octet
      ansible.builtin.set_fact:
        ipa_host_desc: "{{ env_map[octet] | default('env:') }}"
      vars:
        # Looks at first NIC in build.yml and pulls second octet
        octet: "{{ build_vm.networks[0].ipv4_address.split('.')[1] }}"
        env_map:
          "61": "env:PROD"
          "62": "env:TEST"
          "63": "env:DEV"

    - name: Update IPA host description
      ansible.builtin.command:
        cmd: "ipa host-mod {{ ansible_facts['nodename'] }} --desc='{{ ipa_host_desc }}'"
      ignore_errors: true

    - name: Add server to existing IPA hostgroups
      ansible.builtin.command:
        cmd: "ipa hostgroup-add-member {{ item }} --hosts={{ ansible_facts['nodename'] }}"
      #ipa_host_groups defined in build.yml
      loop: "{{ build_vm.ipa_host_groups | default([]) }}"
      when: build_vm.ipa_host_groups is defined and build_vm.ipa_host_groups | length > 0
      register: ipa_result
      ignore_errors: true
      changed_when:
        - "'Number of members added 1' in ipa_result.stdout"
        - ipa_result.rc == 0
  tags:
    - ipa
    - ipa_client

- name: Update permissions of ansible /app/ansible dir
  ansible.builtin.file:
    path: /app/ansible
    state: directory
    owner: hedcadm
    group: allusers
    mode: 0775
  tags: host_config